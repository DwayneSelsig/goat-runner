<svg xmlns="http://www.w3.org/2000/svg" width="725" height="544" viewBox="0 0 725 544" role="img" aria-label="Dark gray diagonal geometric wallpaper with subtle grain">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#393939"/>
      <stop offset="1" stop-color="#454545"/>
    </linearGradient>
    <linearGradient id="leftTriangle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303030"/>
      <stop offset="1" stop-color="#383838"/>
    </linearGradient>
    <linearGradient id="leftBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#484848"/>
      <stop offset="1" stop-color="#3b3b3b"/>
    </linearGradient>
    <linearGradient id="middleBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b4b4b"/>
      <stop offset="0.55" stop-color="#515151"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="lightBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#626262"/>
      <stop offset="0.55" stop-color="#686868"/>
      <stop offset="1" stop-color="#626262"/>
    </linearGradient>
    <linearGradient id="rightBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c4c4c"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
    <!-- A monochrome grain layer: blend random fractal noise lightly over every shape. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="13" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="quietNoise">
        <feFuncR type="linear" slope="0.65" intercept="0.175"/>
        <feFuncG type="linear" slope="0.65" intercept="0.175"/>
        <feFuncB type="linear" slope="0.65" intercept="0.175"/>
        <feFuncA type="linear" slope="0" intercept="0.17"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="quietNoise" mode="soft-light"/>
    </filter>
    <filter id="edgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <g filter="url(#grain)" opacity="0.732">
    <rect width="725" height="544" fill="url(#background)"/>
    <!-- Angular panel at upper left -->
    <path d="M0 0H126L188 107 83 286 0 145Z" fill="url(#leftTriangle)"/>
    <!-- A subtle left fold -->
    <path d="M0 61 83 286 0 430Z" fill="url(#leftBand)"/>
    <!-- Main diagonal dark-grey plane -->
    <path d="M248 0H612L266 544H-66Z" fill="url(#middleBand)"/>
    <!-- Narrow soft bevel below the bright panel's left edge -->
    <path d="M611 0 616 0 270 544 265 544Z" fill="#292929" opacity=".18" filter="url(#edgeShadow)"/>
    <!-- Main light grey diagonal stripe -->
    <path d="M612 0H865L530 544H266Z" fill="url(#lightBand)"/>
    <!-- Right-most medium-dark panel -->
    <path d="M725 194V544H530Z" fill="url(#rightBand)"/>
    <path d="M530 544 725 194V207L537 544Z" fill="#292929" opacity=".12" filter="url(#edgeShadow)"/>
  </g>
</svg>
