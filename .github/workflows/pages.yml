name: Deploy to GitHub Pages
on:
  release:
    types: [published]
permissions:
  contents: read
env:
  # Pin the reviewed private assets so a release is reproducible.
  ASSET_COMMIT: b2e52ad476b34838970784d36e4959f951b3d578
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+\.\d+)$') {
            throw "Release tag '$tag' is invalid. Use v1.2.3.4."
          }
          try { $version = [Version]$Matches.version } catch {
            throw "Release tag '$tag' contains an invalid version component."
          }
          if ($version.Major -gt 65534 -or $version.Minor -gt 65534 -or
              $version.Build -gt 65534 -or $version.Revision -gt 65534) {
            throw 'Every version component must be between 0 and 65534.'
          }
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          path: game
          persist-credentials: false
      - uses: actions/configure-pages@v6.0.0
      - name: Check public assets
        working-directory: game
        run: python3 tools/check-public-assets.py
      - name: Check private asset access is configured
        env:
          ASSETS_DEPLOY_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
        run: |
          if [ -z "$ASSETS_DEPLOY_KEY" ]; then
            echo "::error::Set the ASSETS_DEPLOY_KEY Actions secret to a read-only deploy key for the private assets repository."
            exit 1
          fi
      - name: Check out private assets
        uses: actions/checkout@v7.0.1
        with:
          repository: DwayneSelsig/goat-runner-assets
          ref: ${{ env.ASSET_COMMIT }}
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: private-assets
          persist-credentials: false
      - name: Assemble game with licensed assets
        run: python3 game/tools/prepare-private-build.py --assets private-assets --output assembled-game
      - name: Install Godot and matching export templates
        run: bash game/tools/install-godot.sh
      - name: Import, test and export
        working-directory: assembled-game
        run: bash tools/build-web.sh
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: assembled-game/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
