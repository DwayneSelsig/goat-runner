name: Deploy to GitHub Pages
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+\.\d+)$') {
            throw "Release tag '$tag' is invalid. Use v1.2.3.4."
          }
          try { $version = [Version]$Matches.version } catch {
            throw "Release tag '$tag' contains an invalid version component."
          }
          if ($version.Major -gt 65534 -or $version.Minor -gt 65534 -or
              $version.Build -gt 65534 -or $version.Revision -gt 65534) {
            throw 'Every version component must be between 0 and 65534.'
          }
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          path: game
          persist-credentials: false
      - uses: actions/configure-pages@v6.0.0
        if: github.event_name == 'release'
      - name: Check public assets
        working-directory: game
        run: python3 tools/check-public-assets.py
      - name: Check private asset access is configured
        env:
          ASSETS_READ_TOKEN: ${{ secrets.ASSETS_READ_TOKEN }}
        run: |
          if [ -z "$ASSETS_READ_TOKEN" ]; then
            echo "::error::Set the ASSETS_READ_TOKEN Actions secret to a read-only token for the private assets repository."
            exit 1
          fi
      - name: Check out private assets
        uses: actions/checkout@v7.0.1
        with:
          repository: DwayneSelsig/goat-runner-assets
          # Omitting ref fetches the latest commit on the assets repository's default branch.
          token: ${{ secrets.ASSETS_READ_TOKEN }}
          path: private-assets
          persist-credentials: false
      - name: Record private asset version
        working-directory: private-assets
        run: |
          echo "### Private assets" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble game with licensed assets
        run: python3 game/tools/prepare-private-build.py --assets private-assets --output assembled-game
      - name: Install Godot and matching export templates
        run: bash game/tools/install-godot.sh
      - name: Import, test and export
        working-directory: assembled-game
        run: bash tools/build-web.sh
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name == 'release'
        with:
          path: assembled-game/build/web
  deploy:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
